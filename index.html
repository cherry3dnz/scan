<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo to 3D Gaussian Splat</title>
<style>
  :root { --bg:#101114; --panel:#181a20; --fg:#e8e8ec; --accent:#4f8cff; --gold:#ffd54a; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
               font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  main { display:flex; flex-direction:column; height:100%; gap:6px; padding:6px; }
  section { position:relative; flex:1 1 50%; min-height:0; background:var(--panel);
            border-radius:10px; overflow:hidden; }
  video, #viewer { width:100%; height:100%; display:block; }
  video { object-fit:contain; background:#000; }
  #photo { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000;
           touch-action:none; cursor:crosshair; }
  .dock { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:6px; padding:8px;
          background:linear-gradient(transparent, rgba(0,0,0,.8)); }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px;
           font-size:15px; cursor:pointer; }
  button.small { padding:6px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  button.secondary { background:#333844; }
  select, input { background:#262a33; color:var(--fg); border:1px solid #3a3f4b; border-radius:6px;
                  padding:6px 8px; font-size:13px; max-width:100%; }
  #refLen { width:90px; }
  .chip { background:#2d3340; border-radius:12px; padding:2px 2px 2px 10px; font-size:12px;
          display:inline-flex; align-items:center; gap:4px; }
  .chip button { background:none; padding:0 8px; font-size:14px; }
  #status { position:absolute; top:8px; left:10px; right:10px; font-size:13px; opacity:.95;
            text-shadow:0 1px 3px #000; pointer-events:none; z-index:2; }
  #thumb { position:absolute; top:34px; right:10px; width:84px; border-radius:6px;
           border:2px solid #fff3; display:none; z-index:2; pointer-events:none; }
  #loupe { position:absolute; top:34px; left:10px; width:120px; height:120px; border:2px solid #fff;
           border-radius:8px; background:#000; pointer-events:none; z-index:3; }
  #probe { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border:2px solid var(--gold);
           border-radius:50%; pointer-events:none; }
  #hover { position:absolute; padding:4px 8px; font:12px ui-monospace, Menlo, Consolas, monospace;
           background:rgba(0,0,0,.78); border:1px solid #ffd54a66; border-radius:6px; pointer-events:none;
           white-space:nowrap; }
</style>
</head>
<body>
<main>
  <section id="top">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="photo" hidden></canvas>
    <img id="thumb" alt="captured frame">
    <canvas id="loupe" width="120" height="120" hidden></canvas>
    <div id="status">Starting camera…</div>
    <div class="dock">
      <div id="refbar" hidden>
        <div class="row">
          <select id="refType" title="Reference object"></select>
          <input id="refLen" type="number" min="0" step="any" placeholder="mm" title="Real length in millimetres">
          <button id="addRef" class="small secondary">Add reference</button>
          <button id="applyScale" class="small">Apply metric scale</button>
        </div>
        <div class="row" id="refList"></div>
      </div>
      <div class="row">
        <button id="capture" disabled>📷 Capture &amp; Reconstruct</button>
        <button id="retake" class="secondary" hidden>Retake</button>
        <button id="download" class="secondary" disabled>Download .ply</button>
      </div>
    </div>
  </section>
  <section id="bottom">
    <canvas id="viewer"></canvas>
    <div id="probe" hidden></div>
    <div id="hover" hidden></div>
  </section>
</main>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
