<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syn3D</title>
<style>
  :root { --bg:#101114; --panel:#181a20; --raised:#262a33; --line:#2a2e38; --line2:#3a3f4b;
          --fg:#e8e8ec; --soft:#c9ccd4; --muted:#9aa0ad; --accent:#2d6bea; --gold:#ffd54a; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
               font-family: system-ui, -apple-system, Segoe UI, sans-serif; overscroll-behavior:none; }
  button, select, input { font-family:inherit; }
  button { cursor:pointer; color:inherit; }

  /* one column, top to bottom: title bar / step bar / status banner / content / action dock.
     #app[data-state] (aim | busy | result | scale | pin | metric | error) decides what is visible. */
  #app { position:relative; display:flex; flex-direction:column; height:100%; max-width:760px; margin:0 auto; }

  #bar { flex:none; display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 8px 0 16px; }
  #bar h1 { margin:0; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  #bar .left { display:flex; align-items:center; gap:4px; }
  #back { margin-left:-8px; padding:0 10px 0 6px; }
  .textbtn { height:44px; padding:0 12px; display:inline-flex; align-items:center; gap:6px; background:none;
             border:0; border-radius:10px; color:var(--soft); font-size:14px; }

  /* progress arrows: completed and current steps are filled blue, upcoming steps stay grey */
  #steps { flex:none; display:flex; margin:0; padding:0 16px 12px; list-style:none; }
  #steps li { flex:1; min-width:0; height:38px; display:flex; align-items:center; justify-content:center;
              padding:0 12px 0 20px; margin-left:-9px; white-space:nowrap; font-size:11px; font-weight:500;
              background:var(--raised); color:var(--muted);
              clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); }
  #steps li:first-child { margin-left:0; padding-left:12px;
              clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); border-radius:8px 0 0 8px; }
  #steps li:last-child { padding-right:8px;
              clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 12px 50%); border-radius:0 8px 8px 0; }
  #steps li.done, #steps li.active { background:var(--accent); color:#fff; }
  #steps li.active { font-weight:700; }
  #steps li.done::before { content:"✓"; margin-right:4px; font-weight:700; }

  #status { flex:none; margin:0 16px 12px; padding:10px 12px; background:var(--panel); border:1px solid var(--line);
            border-radius:10px; font-size:13px; line-height:1.4; color:var(--soft); max-height:5.6em; overflow:auto; }

  #content { flex:1 1 0; min-height:0; display:flex; flex-direction:column; gap:10px; padding:0 16px; }
  #stage, #bottom { position:relative; flex:1 1 0; min-height:0; border-radius:14px; overflow:hidden;
                    border:1px solid var(--line); background:#000; }
  #stage { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #bottom { display:none; background:#0a0b0e; }
  #viewer { width:100%; height:100%; display:block; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #photo { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  .tag { position:absolute; left:10px; top:10px; z-index:2; padding:3px 8px; border-radius:10px;
         background:rgba(0,0,0,.6); font-size:11px; pointer-events:none; }
  #vhint { position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:12px;
           color:var(--muted); pointer-events:none; }
  #guide { position:absolute; inset:0; pointer-events:none; }
  #guide i { position:absolute; width:28px; height:28px; border:2px solid var(--fg); }
  #guide i:nth-child(1) { left:16px; top:16px; border-right:0; border-bottom:0; border-top-left-radius:8px; }
  #guide i:nth-child(2) { right:16px; top:16px; border-left:0; border-bottom:0; border-top-right-radius:8px; }
  #guide i:nth-child(3) { left:16px; bottom:16px; border-right:0; border-top:0; border-bottom-left-radius:8px; }
  #guide i:nth-child(4) { right:16px; bottom:16px; border-left:0; border-top:0; border-bottom-right-radius:8px; }

  /* per-state layout */
  #app[data-state=result] #bottom, #app[data-state=metric] #bottom { display:block; }
  #app[data-state=metric] #stage { flex:.6 1 0; }
  #app[data-state=metric] #bottom { flex:1.7 1 0; }
  #app[data-state=scale] #stage { flex:none; height:min(30vh, 240px); }
  #app[data-state=pin] #content { padding:0; gap:0; }
  #app[data-state=pin] #stage { border:0; border-radius:0; }
  #app[data-state=pin] #status { margin:0; border-radius:0; border-width:0 0 1px; padding:8px 16px; background:#0c0d10; }
  #app[data-state=pin] #dock { background:#0c0d10; border-top:1px solid var(--line); }
  #app[data-state=aim] #dock { justify-content:center; }

  /* full-screen camera (aim / ghost / align): no step bar, the title, status text and buttons float over the picture */
  #app[data-state=aim] #steps, #app[data-state=ghost] #steps, #app[data-state=align] #steps { display:none; }
  #app[data-state=aim] #content, #app[data-state=ghost] #content, #app[data-state=align] #content { padding:0; gap:0; }
  #app[data-state=aim] #stage, #app[data-state=ghost] #stage, #app[data-state=align] #stage { border:0; border-radius:0; }
  #app[data-state=aim] #bar, #app[data-state=ghost] #bar, #app[data-state=align] #bar { position:absolute; top:0; left:0; right:0; z-index:6; height:44px; background:linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0)); }
  #app[data-state=aim] #status, #app[data-state=ghost] #status, #app[data-state=align] #status { position:absolute; z-index:6; top:46px; left:12px; right:12px; margin:0;
        background:rgba(12,13,16,.74); border-color:rgba(255,255,255,.14); }
  #app[data-state=aim] #dock, #app[data-state=ghost] #dock, #app[data-state=align] #dock { position:absolute; z-index:6; left:0; right:0; bottom:0; padding-top:36px;
        background:linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,0)); }
  #app[data-state=ghost] #dock .btn, #app[data-state=align] #dock .btn { background-color:rgba(12,13,16,.55); }
  #app[data-state=ghost] #dock .btn.primary, #app[data-state=align] #dock .btn.primary { background-color:var(--accent); }
  #app[data-state=align] #ghost { pointer-events:auto; touch-action:none; cursor:grab; }
  #app[data-state=align] #ghost:active { cursor:grabbing; }

  /* buttons: at most one filled (primary) button on screen */
  .btn { height:48px; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
         border-radius:12px; border:1px solid transparent; background:none; font-size:15px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn.ghost { border-color:var(--line2); color:var(--fg); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn svg, .textbtn svg { flex:none; }

  /* trim toolbar (metric state): select / shape / clear / delete / undo */
  #trim { position:absolute; left:8px; right:8px; bottom:8px; z-index:4; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  #trim .tb { height:44px; min-width:44px; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
              background:rgba(12,13,16,.88); border:1px solid var(--line2); border-radius:22px; color:var(--fg); font-size:13px; }
  #trim .tb.on { border-color:var(--gold); color:var(--gold); }
  #trim .tb.danger { border-color:#e5484d; color:#ff8085; }
  #trim .tb:disabled { opacity:.4; cursor:default; }
  #selLayer { position:absolute; inset:0; z-index:3; cursor:crosshair; touch-action:none; }
  #selCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #app[data-state=metric] #vhint { bottom:64px; }

  #dock { flex:none; display:flex; gap:10px; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); }
  #dock .btn { flex:1; }
  #dock .btn.primary { flex:1.5; }
  #capture { flex:none; width:76px; height:76px; padding:0; border-radius:50%; border:4px solid var(--fg); background:none; }
  #capture span { display:block; width:58px; height:58px; margin:auto; border-radius:50%; background:var(--fg); }
  #capture:disabled { opacity:.45; cursor:default; }

  /* scale sheet */
  #refbar { flex:1 1 0; min-height:0; margin:0 -16px; padding:10px 16px calc(16px + env(safe-area-inset-bottom));
            background:var(--panel); border-top:1px solid var(--line); border-radius:20px 20px 0 0;
            overflow:auto; display:flex; flex-direction:column; gap:12px; }
  .grab { flex:none; align-self:center; width:36px; height:4px; border-radius:2px; background:var(--line2); }
  .sheethead { display:flex; align-items:baseline; justify-content:space-between; }
  .sheethead strong { font-size:16px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  label, .note { font-size:12px; color:var(--muted); }
  .center { text-align:center; }
  .selwrap { position:relative; }
  .selwrap svg { position:absolute; right:12px; top:15px; pointer-events:none; }
  select, input { height:48px; width:100%; padding:0 12px; background:var(--raised); color:var(--fg);
                  border:1px solid var(--line2); border-radius:10px; font-size:15px; }
  select { appearance:none; -webkit-appearance:none; padding-right:40px; }
  #refList { display:flex; flex-wrap:wrap; gap:8px; }
  #refList:empty { display:none; }
  .chip { display:inline-flex; align-items:center; height:44px; padding-left:14px; background:#2d3340;
          border-radius:22px; font-size:13px; }
  .chip button { width:44px; height:44px; padding:0; background:none; border:0; display:flex;
                 align-items:center; justify-content:center; color:var(--soft); }
  .spacer { flex:1; }
  .row2 { display:flex; gap:10px; }
  .row2 .btn { flex:1; }
  .row2 .btn.primary { flex:1.5; }

  /* pinning overlays */
  /* ghost overlay (add-view state): outline of the master drawn over the live camera */
  #ghost { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  #app[data-state=ghost] #dock, #app[data-state=align] #dock, #app[data-state=review] #dock { gap:8px; }
  #app[data-state=ghost] #dock .btn, #app[data-state=align] #dock .btn, #app[data-state=review] #dock .btn { padding:0 10px; font-size:14px; }

  /* capture review: two stacked 3D panels (master on top, new view below) */
  #review { flex:1 1 0; min-height:0; display:flex; flex-direction:column; gap:10px; }
  #app[data-state=review] #stage { display:none; }
  .panel { position:relative; flex:1 1 0; min-height:0; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#0a0b0e; }
  .panel canvas { width:100%; height:100%; display:block; }
  #app[data-state=review] #dock .btn.primary { flex:2; }

  #loupe { position:absolute; top:10px; right:10px; width:180px; height:180px; border:2px solid #fff;
           border-radius:10px; background:#000; pointer-events:none; z-index:3; }
  #zoomTag { position:absolute; left:12px; bottom:20px; padding:2px 8px; font:12px ui-monospace, Menlo, Consolas, monospace;
             background:rgba(0,0,0,.6); border-radius:10px; pointer-events:none; z-index:2; }
  #fitBtn { position:absolute; right:12px; bottom:12px; z-index:3; width:44px; height:44px; padding:0; border-radius:50%;
            display:flex; align-items:center; justify-content:center; background:rgba(12,13,16,.85);
            border:1px solid var(--line2); }
  #probe { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border:2px solid var(--gold);
           border-radius:50%; pointer-events:none; }
  #hover { position:absolute; padding:4px 8px; font:12px ui-monospace, Menlo, Consolas, monospace;
           background:rgba(0,0,0,.78); border:1px solid #ffd54a66; border-radius:6px; pointer-events:none;
           white-space:nowrap; }
</style>
</head>
<body>
<main id="app" data-state="aim">

  <header id="bar" data-states="aim busy result scale metric error ghost align review">
    <div class="left">
      <button id="back" class="textbtn" data-states="result scale metric error" aria-label="Back" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span id="backLabel">Back</span>
      </button>
      <h1>Syn3D</h1>
    </div>
    <button id="retake" class="textbtn" data-states="metric" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Retake
    </button>
  </header>

  <ol id="steps" data-states="aim busy result scale metric error ghost review">
    <li>1 Capture</li>
    <li>2 Preview</li>
    <li>3 Scale</li>
    <li>4 Save</li>
  </ol>

  <div id="status" role="status">Starting camera…</div>

  <div id="content">
    <div id="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="photo" hidden></canvas>
      <canvas id="ghost" hidden aria-hidden="true"></canvas>
      <div id="guide" data-states="aim" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <span class="tag" data-states="result scale metric" hidden>Photo</span>
      <canvas id="loupe" width="360" height="360" hidden></canvas>
      <div id="zoomTag" hidden></div>
      <button id="fitBtn" aria-label="Fit photo to screen" title="Reset zoom" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div id="review" data-states="review" hidden>
      <section class="panel">
        <canvas id="revTopCv"></canvas>
        <span class="tag" id="revTopTag">Master</span>
      </section>
      <section class="panel">
        <canvas id="revBotCv"></canvas>
        <span class="tag" id="revBotTag">New view</span>
      </section>
    </div>

    <section id="bottom">
      <canvas id="viewer"></canvas>
      <span class="tag" id="vlabel">3D preview · relative depth</span>
      <span id="vhint">Drag to tilt · scroll or pinch to zoom</span>
      <div id="probe" hidden></div>
      <div id="hover" hidden></div>
      <div id="selLayer" hidden><canvas id="selCanvas"></canvas></div>
      <div id="trim" data-states="metric" hidden>
        <button id="selToggle" class="tb" aria-pressed="false" title="Select points to delete">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"/><path d="M12 9v6M9 12h6"/></svg>
          Select
        </button>
        <button id="selShape" class="tb" title="Selection shape: box" aria-label="Selection shape: box" hidden></button>
        <button id="selClear" class="tb" title="Clear selection" aria-label="Clear selection" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button id="selDelete" class="tb danger" disabled hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          <span id="selDelLabel">Delete</span>
        </button>
        <button id="addView" class="tb" title="Add a view from the current 3D angle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Add view
        </button>
        <button id="selUndo" class="tb" title="Undo delete" aria-label="Undo delete" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
      </div>
    </section>

    <div id="refbar" data-states="scale" hidden>
      <div class="grab"></div>
      <div class="sheethead"><strong>Real-world scale</strong><span class="note" id="refCount">0 of 2 references</span></div>
      <div class="field">
        <label for="refType">Reference object</label>
        <div class="selwrap">
          <select id="refType" title="Reference object"></select>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa0ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="note" id="lenNote"></div>
        <div id="lenRow" class="field" hidden>
          <label for="refLen">Real length (mm)</label>
          <input id="refLen" type="number" min="0" step="any" inputmode="decimal" placeholder="mm">
        </div>
      </div>
      <div id="refList"></div>
      <button id="addRef" class="btn ghost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span id="addLabel">Add reference</span>
      </button>
      <div class="spacer"></div>
      <div id="applyHint" class="note center"></div>
      <div class="row2">
        <button id="cancelScale" class="btn ghost">Cancel</button>
        <button id="applyScale" class="btn primary" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          Apply scale
        </button>
      </div>
    </div>
  </div>

  <footer id="dock" data-states="aim busy result pin metric ghost align review">
    <button id="capture" aria-label="Capture photo" data-states="aim" disabled><span></span></button>
    <button id="working" class="btn primary" data-states="busy" disabled hidden>Working…</button>
    <button id="download" class="btn ghost" data-states="result metric" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
      Download .ply
    </button>
    <button id="openScale" class="btn primary" data-states="result metric" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>
      <span id="openLabel">Add real-world scale</span>
    </button>
    <button id="ghostCancel" class="btn ghost" data-states="ghost" hidden>Cancel</button>
    <button id="ghostMode" class="btn ghost" data-states="ghost" hidden>Ghost: edges</button>
    <button id="ghostShoot" class="btn primary" data-states="ghost" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Capture
    </button>
    <button id="alignRetake" class="btn ghost" data-states="align" hidden>Retake</button>
    <button id="alignAuto" class="btn ghost" data-states="align" hidden>Auto-align</button>
    <button id="alignReview" class="btn ghost" data-states="align" hidden>Compare</button>
    <button id="reviewRetake" class="btn ghost" data-states="review" hidden>Retake</button>
    <button id="reviewAdjust" class="btn ghost" data-states="review" hidden>Adjust</button>
    <button id="reviewDownload" class="btn ghost" data-states="review" style="flex:none;width:48px;padding:0" title="Download both point clouds (.ply)" aria-label="Download both point clouds" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
    </button>
    <button id="reviewMerge" class="btn primary" data-states="review" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
      Merge two point clouds
    </button>
    <button id="alignMerge" class="btn primary" data-states="align" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
      Merge
    </button>
    <button id="cancelPin" class="btn ghost" data-states="pin" hidden>Cancel</button>
    <button id="doneBtn" class="btn primary" data-states="pin" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
      Done
    </button>
  </footer>

</main>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
