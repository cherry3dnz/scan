<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo to 3D Gaussian Splat</title>
<style>
  :root { --bg:#101114; --panel:#181a20; --fg:#e8e8ec; --accent:#4f8cff; --gold:#ffd54a; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
               font-family: system-ui, -apple-system, Segoe UI, sans-serif; overscroll-behavior:none; }
  main { display:flex; flex-direction:column; height:100%; gap:6px; padding:6px; }
  section { position:relative; flex:1 1 50%; min-height:0; background:var(--panel);
            border-radius:10px; overflow:hidden; }
  #viewer { width:100%; height:100%; display:block; }

  /* top panel: status bar / stage (video or photo) / control dock, stacked so nothing covers the image */
  #top { display:flex; flex-direction:column; }
  #status { flex:none; padding:6px 10px; font-size:13px; line-height:1.3; max-height:5.4em; overflow:auto; }
  #stage { position:relative; flex:1 1 0; min-height:0; background:#000; overflow:hidden;
           user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #photo { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .dock { flex:none; display:flex; flex-direction:column; gap:6px; padding:8px; background:#0c0d10; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; }

  /* full-screen pinning mode: 3D viewer hidden, photo gets the whole screen */
  main.pinning { padding:0; gap:0; }
  main.pinning #bottom { display:none; }
  main.pinning #top { border-radius:0; flex-basis:100%; }
  main.pinning #thumb { display:none !important; }
  main.pinning .actions { display:none; }
  main.pinning #status { font-size:12px; padding:5px 8px; }
  main.pinning .dock { padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }

  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px;
           font-size:15px; cursor:pointer; }
  button.small { padding:8px 12px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  button.secondary { background:#333844; }
  button.done { background:#2e9d5b; }
  select, input { background:#262a33; color:var(--fg); border:1px solid #3a3f4b; border-radius:6px;
                  padding:7px 8px; font-size:14px; max-width:100%; }
  #refLen { width:90px; }
  .chip { background:#2d3340; border-radius:12px; padding:2px 2px 2px 10px; font-size:12px;
          display:inline-flex; align-items:center; gap:4px; }
  .chip button { background:none; padding:0 8px; font-size:14px; }
  #thumb { position:absolute; top:10px; right:10px; width:84px; border-radius:6px;
           border:2px solid #fff3; display:none; z-index:2; pointer-events:none; }
  #loupe { position:absolute; top:10px; right:10px; width:180px; height:180px; border:2px solid #fff;
           border-radius:10px; background:#000; pointer-events:none; z-index:3; }
  #zoomTag { position:absolute; left:8px; bottom:8px; padding:2px 8px; font:12px ui-monospace, Menlo, Consolas, monospace;
             background:rgba(0,0,0,.6); border-radius:10px; pointer-events:none; z-index:2; }
  #probe { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border:2px solid var(--gold);
           border-radius:50%; pointer-events:none; }
  #hover { position:absolute; padding:4px 8px; font:12px ui-monospace, Menlo, Consolas, monospace;
           background:rgba(0,0,0,.78); border:1px solid #ffd54a66; border-radius:6px; pointer-events:none;
           white-space:nowrap; }
</style>
</head>
<body>
<main id="app">
  <section id="top">
    <div id="status">Starting camera…</div>
    <div id="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="photo" hidden></canvas>
      <img id="thumb" alt="captured frame">
      <canvas id="loupe" width="360" height="360" hidden></canvas>
      <div id="zoomTag" hidden></div>
    </div>
    <div class="dock">
      <div id="refbar" hidden>
        <div class="row">
          <select id="refType" title="Reference object"></select>
          <input id="refLen" type="number" min="0" step="any" placeholder="mm" title="Real length in millimetres">
        </div>
        <div class="row">
          <button id="addRef" class="small secondary">Add reference</button>
          <button id="applyScale" class="small">Apply metric scale</button>
          <button id="fitBtn" class="small secondary" hidden title="Reset zoom">Fit</button>
          <button id="doneBtn" class="small done" hidden>Done</button>
        </div>
        <div class="row" id="refList"></div>
      </div>
      <div class="row actions">
        <button id="capture" disabled>📷 Capture &amp; Reconstruct</button>
        <button id="retake" class="secondary" hidden>Retake</button>
        <button id="download" class="secondary" disabled>Download .ply</button>
      </div>
    </div>
  </section>
  <section id="bottom">
    <canvas id="viewer"></canvas>
    <div id="probe" hidden></div>
    <div id="hover" hidden></div>
  </section>
</main>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
