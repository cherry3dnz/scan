<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo to 3D Gaussian Splat</title>
<style>
  :root { --bg:#101114; --panel:#181a20; --fg:#e8e8ec; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
               font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  main { display:flex; flex-direction:column; height:100%; gap:6px; padding:6px; }
  section { position:relative; flex:1 1 50%; min-height:0; background:var(--panel);
            border-radius:10px; overflow:hidden; }
  video, #viewer { width:100%; height:100%; display:block; }
  video { object-fit:contain; background:#000; }
  .bar { position:absolute; left:0; right:0; bottom:0; display:flex; gap:8px; align-items:center;
         justify-content:center; padding:10px; background:linear-gradient(transparent, rgba(0,0,0,.7)); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px;
           font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.secondary { background:#333844; }
  #status { position:absolute; top:8px; left:10px; right:10px; font-size:13px; opacity:.9;
            text-shadow:0 1px 3px #000; pointer-events:none; }
  #thumb { position:absolute; top:34px; right:10px; width:84px; border-radius:6px;
           border:2px solid #fff3; display:none; }
</style>
</head>
<body>
<main>
  <section id="top">
    <video id="cam" autoplay playsinline muted></video>
    <img id="thumb" alt="captured frame">
    <div id="status">Starting camera…</div>
    <div class="bar">
      <button id="capture" disabled>📷 Capture &amp; Reconstruct</button>
      <button id="download" class="secondary" disabled>Download .ply</button>
    </div>
  </section>
  <section id="bottom">
    <canvas id="viewer"></canvas>
  </section>
</main>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
